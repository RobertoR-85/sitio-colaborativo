<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ubicaciones | Fashion Boutique</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      /* Paleta de colores y degradado */
      --azul-oscuro: #0f3b4a;
      --azul-medio: #2a6b88;
      --azul-claro: #6ec0c8;
      --celeste: #cfeff3;

      background-image:
        repeating-linear-gradient(
          120deg,
          rgba(255, 255, 255, 0.03) 0px,
          rgba(255, 255, 255, 0.03) 2px,
          transparent 2px,
          transparent 60px
        ),
        linear-gradient(
          135deg,
          var(--azul-oscuro) 0%,
          var(--azul-medio) 35%,
          var(--azul-claro) 70%,
          var(--celeste) 100%
        ),
        radial-gradient(circle at 20% 30%, rgba(255,255,255,0.05), transparent 60%),
        radial-gradient(circle at 80% 70%, rgba(0,0,0,0.1), transparent 70%);
      
      background-blend-mode: overlay, normal, soft-light, normal;
      background-size: 200px 200px, cover, cover, cover;
      background-attachment: fixed;
      background-position: center;

      filter: contrast(1.05) saturate(1.08);
      color: #fff;
      font-family: "Segoe UI", sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at top right, rgba(255,255,255,0.06), transparent 40%),
                  radial-gradient(ellipse at bottom left, rgba(0,0,0,0.15), transparent 60%);
      mix-blend-mode: multiply;
    }

    h2, p {
      text-align: center;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
      margin-top: 20px;
    }

    /* Contenedor del mapa y la imagen */
    .map-img-container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      align-items: flex-start;
      margin-top: 30px;
      margin-bottom: 50px;
    }

    .map-container, .img-container {
      flex: 1 1 400px;
      max-width: 600px;
    }

    .img-container img {
      width: 100%;
      border-radius: 15px;
      box-shadow: 0 8px 18px rgba(0,0,0,0.5);
    }

    /* Ajuste navbar */
    .navbar {
      background-color: rgba(0, 0, 0, 0.3) !important;
      backdrop-filter: blur(8px);
    }

    .navbar-brand, .nav-link, .btn-outline-light {
      color: #fff !important;
    }

    .nav-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- Barra de Navegación -->
  <nav class="navbar navbar-expand-lg fixed-top">
    <div class="container">
      <a class="navbar-brand" href="#">Fashion Boutique</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto align-items-center">
          <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="productos.html">Productos</a></li>
          <li class="nav-item"><a class="nav-link" href="ubicaciones.html">Ubicaciones</a></li>
          <li class="nav-item"><a class="nav-link" href="ofertas.html">Ofertas</a></li>
          <li class="nav-item"><a class="btn btn-outline-light ms-2" href="#">Iniciar Sesión</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container">
    <h2>📍 Encuentra nuestra tienda</h2>
    <p>Visítanos en <strong>Fashion Boutique</strong>, ubicada en Ciudad de Guatemala.</p>

    <div class="map-img-container">
      <!-- Mapa -->
      <div class="map-container">
        <iframe
          src="https://www.google.com/maps?q=Fashion+Boutique,+Ciudad+de+Guatemala&output=embed"
          width="100%"
          height="450"
          style="border:0;"
          allowfullscreen=""
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade">
        </iframe>
      </div>

      <!-- Imagen de la tienda -->
      <div class="img-container">
        <img src="imagenes/thiet-ke-shop-thoi-trang-ngoc-anh-boutique-2.jpg" alt="Imagen de Fashion Boutique">
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
